<div x-data="matchForm({{ match_json|safe }})" class="max-w-3xl mx-auto">

  <h1 class="text-2xl font-bold mb-1">{{ heading }}</h1>
  <p class="text-gray-500 text-sm mb-6">Format: <span class="font-semibold">{{ engine.format_quota|int }} overs</span> per innings</p>

  <form method="post" action="{{ action_url }}" class="space-y-6">

    <!-- Team 1 -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
      <h2 class="text-lg font-semibold text-blue-700 mb-4">Team 1 (batting first)</h2>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Team Name *</label>
          <input name="team1" required
                 class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                 :class="errors.team1 && 'border-red-500'"
                 x-model="form.team1"
                 placeholder="e.g. India">
          <p class="text-red-500 text-xs mt-1" x-show="errors.team1" x-text="errors.team1"></p>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Runs *</label>
          <input name="team1_runs" type="number" min="0" required
                 class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                 :class="errors.team1_runs && 'border-red-500'"
                 x-model="form.team1_runs"
                 placeholder="e.g. 165">
          <p class="text-red-500 text-xs mt-1" x-show="errors.team1_runs" x-text="errors.team1_runs"></p>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Overs *</label>
          <input name="team1_overs" type="number" step="0.1" min="0" max="{{ engine.format_quota|int }}" required
                 class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                 :class="errors.team1_overs && 'border-red-500'"
                 x-model="form.team1_overs"
                 placeholder="e.g. 20.0">
          <p class="text-red-500 text-xs mt-1" x-show="errors.team1_overs" x-text="errors.team1_overs"></p>
        </div>
      </div>
      <label class="inline-flex items-center gap-2 mt-4 cursor-pointer text-sm text-gray-700">
        <input name="team1_bowled_out" type="checkbox"
               class="rounded border-gray-300 text-blue-600 focus:ring-blue-500"
               x-model="form.team1_bowled_out">
        Bowled out (all out)?
      </label>
    </div>

    <!-- DLS -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
      <label class="inline-flex items-center gap-2 cursor-pointer text-sm font-medium text-gray-700">
        <input name="is_dls" type="checkbox"
               class="rounded border-gray-300 text-blue-600 focus:ring-blue-500"
               x-model="form.is_dls"
               @change="if (!form.is_dls) { form.team2_dls_allocated_overs=''; form.team2_dls_par_score=''; }">
        This match was affected by DLS (rain/weather revision)
      </label>
      <div x-show="form.is_dls" x-transition class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">DLS Allocated Overs (Team 2)</label>
          <input name="team2_dls_allocated_overs" type="number" step="0.1" min="0"
                 class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                 :class="errors.team2_dls_allocated_overs && 'border-red-500'"
                 x-model="form.team2_dls_allocated_overs"
                 :required="form.is_dls"
                 placeholder="e.g. 12">
          <p class="text-red-500 text-xs mt-1" x-show="errors.team2_dls_allocated_overs" x-text="errors.team2_dls_allocated_overs"></p>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">DLS Par Score / Revised Target</label>
          <input name="team2_dls_par_score" type="number" min="0"
                 class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                 :class="errors.team2_dls_par_score && 'border-red-500'"
                 x-model="form.team2_dls_par_score"
                 :required="form.is_dls"
                 placeholder="e.g. 105">
          <p class="text-red-500 text-xs mt-1" x-show="errors.team2_dls_par_score" x-text="errors.team2_dls_par_score"></p>
        </div>
      </div>
    </div>

    <!-- Team 2 -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
      <h2 class="text-lg font-semibold text-blue-700 mb-4">Team 2 (batting second)</h2>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Team Name *</label>
          <input name="team2" required
                 class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                 :class="errors.team2 && 'border-red-500'"
                 x-model="form.team2"
                 placeholder="e.g. Australia">
          <p class="text-red-500 text-xs mt-1" x-show="errors.team2" x-text="errors.team2"></p>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Runs *</label>
          <input name="team2_runs" type="number" min="0" required
                 class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                 :class="errors.team2_runs && 'border-red-500'"
                 x-model="form.team2_runs"
                 placeholder="e.g. 160">
          <p class="text-red-500 text-xs mt-1" x-show="errors.team2_runs" x-text="errors.team2_runs"></p>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Overs *</label>
          <input name="team2_overs" type="number" step="0.1" min="0" max="{{ engine.format_quota|int }}" required
                 class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                 :class="errors.team2_overs && 'border-red-500'"
                 x-model="form.team2_overs"
                 placeholder="e.g. 19.4">
          <p class="text-red-500 text-xs mt-1" x-show="errors.team2_overs" x-text="errors.team2_overs"></p>
        </div>
      </div>
      <label class="inline-flex items-center gap-2 mt-4 cursor-pointer text-sm text-gray-700">
        <input name="team2_bowled_out" type="checkbox"
               class="rounded border-gray-300 text-blue-600 focus:ring-blue-500"
               x-model="form.team2_bowled_out">
        Bowled out (all out)?
      </label>
    </div>

    <!-- Submit -->
    <div class="flex items-center gap-4">
      <button type="submit"
              class="bg-blue-700 hover:bg-blue-800 text-white font-semibold px-6 py-2.5 rounded-lg shadow transition text-sm disabled:opacity-50"
              :disabled="submitting">
        <span x-show="!submitting">{{ submit_label }}</span>
        <span x-show="submitting" class="flex items-center gap-2">
          <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
          Saving…
        </span>
      </button>
      <a href="{{ url_for('standings') }}" class="text-sm text-gray-500 hover:text-gray-700 underline">Back to standings</a>
    </div>

  </form>
</div>
